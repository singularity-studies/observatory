name: Validate research scaffold

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scaffold and locked Waves
        run: python scripts/validate.py --base-ref "origin/${{ github.event.repository.default_branch }}"
      - name: Run tests
        run: python -m unittest discover -s tests -v
